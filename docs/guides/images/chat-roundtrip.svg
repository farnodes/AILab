<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#fff"/>
  <text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">You send one JSON body</text>
  <rect x="16" y="40" width="280" height="150" fill="#f5f5f5" stroke="#000"/>
  <text x="32" y="68" font-family="ui-monospace, monospace" font-size="14">model: lfm3</text>
  <text x="32" y="96" font-family="ui-monospace, monospace" font-size="14">system: policy</text>
  <text x="32" y="124" font-family="ui-monospace, monospace" font-size="14">user: the task</text>
  <text x="32" y="152" font-family="ui-monospace, monospace" font-size="14">assistant: prior reply</text>
  <text x="32" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">only if you resend it</text>
  <line x1="296" y1="115" x2="360" y2="115" stroke="#000" stroke-width="2"/>
  <polygon points="360,109 372,115 360,121" fill="#000"/>
  <text x="400" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">You read these fields</text>
  <rect x="384" y="40" width="320" height="36" fill="#000"/>
  <text x="400" y="64" fill="#fff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">content — show this</text>
  <rect x="384" y="84" width="320" height="36" fill="#fff" stroke="#000"/>
  <text x="400" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">reasoning — hidden, still billed</text>
  <rect x="384" y="128" width="320" height="36" fill="#fff" stroke="#000"/>
  <text x="400" y="152" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">usage — prompt + completion tokens</text>
  <rect x="384" y="172" width="320" height="36" fill="#fff" stroke="#000"/>
  <text x="400" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">finish_reason — stop or length</text>
</svg>
