<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AILab — Roadmap</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=12" />
    <link rel="stylesheet" href="/reader.css?v=4" />
  </head>
  <body>
    <div class="layout" id="layout">
      <aside class="sidebar" id="sidebar">
        <header class="brand">
          <p class="eyebrow">AILab</p>
          <h1>Roadmap</h1>
          <p class="muted" id="subtitle">Loading…</p>
        </header>
        <nav id="day-nav" class="phase-nav" aria-label="Phases and days"></nav>
        <section class="panel resources-panel">
          <h2>Learning resources</h2>
          <ul id="global-resources"></ul>
        </section>
        <p class="save-hint muted" id="save-status">
          Progress stays on this computer.
        </p>
      </aside>
      <div class="stage">
        <button type="button" id="nav-backdrop" class="nav-backdrop" aria-label="Close days"></button>
        <div class="stage-bar">
          <button type="button" id="days-toggle" class="days-toggle">Days</button>
          <button type="button" id="continue-btn" class="continue-btn" hidden>
            Continue
          </button>
        </div>
        <main class="main" id="main">
          <p class="muted">Loading curriculum…</p>
        </main>
      </div>
      <aside id="doc-panel" class="doc-panel" hidden>
        <header class="doc-bar">
          <span class="doc-label" id="doc-label"></span>
          <a id="doc-full" href="#">Open full page</a>
          <button type="button" id="doc-close" class="pager-btn">Close</button>
        </header>
        <article class="doc-body reader-main" id="doc-body"></article>
      </aside>
    </div>
    <script src="/app.js?v=12" type="module"></script>
  </body>
</html>
